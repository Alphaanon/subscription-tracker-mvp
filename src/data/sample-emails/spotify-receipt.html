<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; background-color: #191414; color: white; }
    .container { max-width: 500px; margin: 0 auto; background: #282828; padding: 25px; border-radius: 10px; }
    .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .receipt-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
    .receipt-details { background: #191414; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .amount { font-size: 28px; font-weight: bold; margin: 10px 0; }
    .detail-row { display: flex; justify-content: space-between; margin: 8px 0; }
    .label { color: #b3b3b3; }
    .value { font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Spotify</div>
    <div class="receipt-title">Payment Receipt</div>
    
    <p>Hi there,</p>
    <p>We've received your payment for Spotify Premium.</p>
    
    <div class="receipt-details">
      <div class="detail-row">
        <span class="label">Subscription:</span>
        <span class="value">Spotify Premium Individual</span>
      </div>
      <div class="detail-row">
        <span class="label">Billing Cycle:</span>
        <span class="value">Monthly</span>
      </div>
      <div class="detail-row">
        <span class="label">Amount:</span>
        <span class="value">$9.99 USD</span>
      </div>
      <div class="detail-row">
        <span class="label">Billing Date:</span>
        <span class="value">September 8, 2026</span>
      </div>
      <div class="detail-row">
        <span class="label">Next Billing:</span>
        <span class="value">October 8, 2026</span>
      </div>
      <hr style="border-color: #404040; margin: 15px 0;">
      <div class="detail-row">
        <span class="label">Transaction ID:</span>
        <span class="value">SPOT-98765432</span>
      </div>
    </div>
    
    <p style="color: #b3b3b3; font-size: 12px;">Need help? Visit spotify.com/contact</p>
  </div>
</body>
</html>
